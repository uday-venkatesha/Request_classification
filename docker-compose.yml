services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aid
      POSTGRES_PASSWORD: aid
      POSTGRES_DB: aidroute
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aid -d aidroute"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.50.26
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  metabase-data:
