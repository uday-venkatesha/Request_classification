name: Drift check

# Runs every Monday morning, or by hand from the Actions tab.
# Needs the repository secret DATABASE_URL (the production database).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: not-needed  # this job makes no LLM calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m evals.drift_check
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/match_drift.html
