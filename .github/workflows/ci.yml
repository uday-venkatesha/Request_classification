name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres with pgvector runs next to the tests. The LLM calls are faked.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aid
          POSTGRES_PASSWORD: aid
          POSTGRES_DB: aidroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aid -d aidroute"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aid:aid@localhost:5432/aidroute

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aidroute .
